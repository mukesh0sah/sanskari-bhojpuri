apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: sanskari-bhojpuri:1.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - wget -qO- http://sanskari-bhojpuri | grep -q "this text is not on the page" && echo "SMOKE TEST PASSED"
