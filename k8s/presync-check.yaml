apiVersion: batch/v1
kind: Job
metadata:
  name: presync-check
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: sanskari-bhojpuri:1.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo 'Pretend DB migration...'; sleep 10; echo done"]
