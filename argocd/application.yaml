apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sanskari-bhojpuri
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mukesh0sah/sanskari-bhojpuri.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: sanskari-bhojpuri
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
      enabled: false
